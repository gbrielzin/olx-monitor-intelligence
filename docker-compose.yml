services:
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8501:8501"
    depends_on:
      - scraper
    restart: unless-stopped
